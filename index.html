<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>RaceSight Finish Line Timer</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3253/3253163.png" />

  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 46vh;
      background: #000;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #ui {
      padding: 8px 12px;
      height: 54vh;
      box-sizing: border-box;
      overflow-y: auto;
      background: #1e1e1e;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }
    button {
      padding: 6px 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    button:disabled { background: #444; color: #888; }
    button.start-btn { background: #16a34a; }
    button.stop-btn { background: #dc2626; }
    select {
      padding: 6px 8px;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 5px;
      font-size: 12px;
      max-width: 100%;
      flex: 1;
    }
    .btn-group { display: flex; gap: 3px; }
    .btn-sm {
      padding: 4px 7px;
      background: #334155;
      font-size: 11px;
    }
    .btn-sm.active { background: #0284c7; }
    .slider-group {
      display: flex;
      flex-direction: column;
      font-size: 11px;
      flex: 1;
      color: #94a3b8;
    }
    .slider-group span { color: #f8fafc; font-weight: 600; }
    input[type=range] { width: 100%; margin: 2px 0; }
    #timerDisplay {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      background: #0f172a;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
      min-width: 85px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 4px;
    }
    th, td {
      padding: 4px 6px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th { color: #94a3b8; font-size: 10px; text-transform: uppercase; }
    .badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="ui">
  <!-- Lens/Camera Selector Row -->
  <div class="row">
    <select id="cameraSelect">
      <option value="">Detecting Camera Lenses...</option>
    </select>
    <button id="camBtn">Start Camera</button>
  </div>

  <!-- Race Control & Timer Display -->
  <div class="row">
    <button id="timerBtn" class="start-btn" disabled>Start Race (T₀)</button>
    <div id="timerDisplay">00:00.00</div>
    <button id="resetBtn">Reset</button>
  </div>

  <!-- Zoom Controls -->
  <div class="row">
    <div class="slider-group">
      <label>Zoom: <span id="zoomVal">1.0x</span></label>
      <input type="range" id="zoomSlider" min="1" max="10" step="0.1" value="1" disabled />
    </div>
    <div class="btn-group">
      <button class="btn-sm active" id="zoom1x">1x</button>
      <button class="btn-sm" id="zoom2x">2x</button>
      <button class="btn-sm" id="zoom3x">3x</button>
      <button class="btn-sm" id="zoom5x">5x</button>
    </div>
  </div>

  <!-- Finish Line Horizontal & Vertical Controls -->
  <div class="row">
    <div class="slider-group">
      <label>Line X (Position): <span id="xVal">50%</span></label>
      <input type="range" id="lineXSlider" min="5" max="95" value="50" />
    </div>
    <div class="slider-group">
      <label>Min Brightness: <span id="threshVal">200</span></label>
      <input type="range" id="threshSlider" min="80" max="255" value="200" />
    </div>
  </div>

  <div class="row">
    <div class="slider-group">
      <label>Line Top (Y₁): <span id="topVal">15%</span></label>
      <input type="range" id="lineTopSlider" min="0" max="80" value="15" />
    </div>
    <div class="slider-group">
      <label>Line Bottom (Y₂): <span id="bottomVal">85%</span></label>
      <input type="range" id="lineBottomSlider" min="20" max="100" value="85" />
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Color</th>
        <th>Elapsed</th>
        <th>Split</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(console.error);
  }

  const video = document.getElementById('webcam');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');

  const cameraSelect = document.getElementById('cameraSelect');
  const camBtn = document.getElementById('camBtn');
  const timerBtn = document.getElementById('timerBtn');
  const timerDisplay = document.getElementById('timerDisplay');
  const resetBtn = document.getElementById('resetBtn');
  
  const lineXSlider = document.getElementById('lineXSlider');
  const lineTopSlider = document.getElementById('lineTopSlider');
  const lineBottomSlider = document.getElementById('lineBottomSlider');
  const threshSlider = document.getElementById('threshSlider');
  const zoomSlider = document.getElementById('zoomSlider');
  const zoomVal = document.getElementById('zoomVal');
  const resultsBody = document.getElementById('resultsBody');

  let currentStream = null;
  let videoTrack = null;
  let isCameraRunning = false;
  let raceRunning = false;
  let raceStartTime = null;
  let currentZoom = 1.0;
  let hasHardwareZoom = false;

  let finishCrossings = [];
  const DEBOUNCE_MS = 4000;
  const lastColorTrigger = {};
  let activeTriggers = [];

  async function listCameras() {
    try {
      const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      const devices = await navigator.mediaDevices.enumerateDevices();
      tempStream.getTracks().forEach(t => t.stop());

      cameraSelect.innerHTML = '';
      const videoDevices = devices.filter(d => d.kind === 'videoinput');

      videoDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `Camera Lens ${index + 1} (${device.deviceId.slice(0, 5)}...)`;
        if (device.label.toLowerCase().includes('back') || device.label.toLowerCase().includes('environment') || device.label.toLowerCase().includes('telephoto') || device.label.toLowerCase().includes('rear')) {
          option.selected = true;
        }
        cameraSelect.appendChild(option);
      });
    } catch (e) {
      console.warn('Unable to enumerate cameras:', e);
      cameraSelect.innerHTML = '<option value="">Default Rear Camera</option>';
    }
  }

  window.addEventListener('DOMContentLoaded', listCameras);

  function formatTime(ms) {
    const totalSeconds = ms / 1000;
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = (totalSeconds % 60).toFixed(2);
    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(5, '0')}`;
  }

  function updateTimer() {
    if (!raceRunning) return;
    const elapsed = performance.now() - raceStartTime;
    timerDisplay.innerText = formatTime(elapsed);
    requestAnimationFrame(updateTimer);
  }

  timerBtn.addEventListener('click', () => {
    if (!raceRunning) {
      raceStartTime = performance.now();
      raceRunning = true;
      timerBtn.innerText = 'Stop Race';
      timerBtn.className = 'stop-btn';
      requestAnimationFrame(updateTimer);
    } else {
      raceRunning = false;
      timerBtn.innerText = 'Start Race (T₀)';
      timerBtn.className = 'start-btn';
    }
  });

  async function startCamera(deviceId = null) {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }

    const constraints = {
      video: {
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    };

    if (deviceId) {
      constraints.video.deviceId = { exact: deviceId };
    } else {
      constraints.video.facingMode = { ideal: 'environment' };
    }

    try {
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
      await video.play();

      videoTrack = currentStream.getVideoTracks()[0];
      const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

      if (capabilities.zoom) {
        hasHardwareZoom = true;
        zoomSlider.min = capabilities.zoom.min || 1;
        zoomSlider.max = capabilities.zoom.max || 10;
        zoomSlider.step = capabilities.zoom.step || 0.1;
      } else {
        hasHardwareZoom = false;
        zoomSlider.min = 1;
        zoomSlider.max = 8;
        zoomSlider.step = 0.1;
      }
      zoomSlider.disabled = false;

      camBtn.disabled = true;
      timerBtn.disabled = false;
      isCameraRunning = true;
      requestAnimationFrame(processFrame);
    } catch (err) {
      alert('Camera error: ' + err.message);
    }
  }

  camBtn.addEventListener('click', () => startCamera(cameraSelect.value || null));
  cameraSelect.addEventListener('change', () => {
    if (isCameraRunning) startCamera(cameraSelect.value);
  });

  async function setZoom(zoomLevel) {
    currentZoom = parseFloat(zoomLevel);
    zoomSlider.value = currentZoom;
    zoomVal.innerText = `${currentZoom.toFixed(1)}x`;

    document.querySelectorAll('.btn-group .btn-sm').forEach(btn => btn.classList.remove('active'));

    if (hasHardwareZoom && videoTrack) {
      try {
        await videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] });
      } catch (err) {
        console.warn('Hardware zoom fallback to canvas crop:', err);
      }
    }
  }

  zoomSlider.addEventListener('input', (e) => setZoom(e.target.value));
  document.getElementById('zoom1x').addEventListener('click', (e) => { setZoom(1.0); e.target.classList.add('active'); });
  document.getElementById('zoom2x').addEventListener('click', (e) => { setZoom(2.0); e.target.classList.add('active'); });
  document.getElementById('zoom3x').addEventListener('click', (e) => { setZoom(3.0); e.target.classList.add('active'); });
  document.getElementById('zoom5x').addEventListener('click', (e) => { setZoom(5.0); e.target.classList.add('active'); });

  lineXSlider.addEventListener('input', (e) => document.getElementById('xVal').innerText = `${e.target.value}%`);
  lineTopSlider.addEventListener('input', (e) => {
    if (parseInt(e.target.value) >= parseInt(lineBottomSlider.value)) {
      e.target.value = parseInt(lineBottomSlider.value) - 5;
    }
    document.getElementById('topVal').innerText = `${e.target.value}%`;
  });
  lineBottomSlider.addEventListener('input', (e) => {
    if (parseInt(e.target.value) <= parseInt(lineTopSlider.value)) {
      e.target.value = parseInt(lineTopSlider.value) + 5;
    }
    document.getElementById('bottomVal').innerText = `${e.target.value}%`;
  });
  threshSlider.addEventListener('input', (e) => document.getElementById('threshVal').innerText = e.target.value);

  resetBtn.addEventListener('click', () => {
    raceRunning = false;
    raceStartTime = null;
    timerBtn.innerText = 'Start Race (T₀)';
    timerBtn.className = 'start-btn';
    timerDisplay.innerText = '00:00.00';
    finishCrossings = [];
    activeTriggers = [];
    resultsBody.innerHTML = '';
    for (let key in lastColorTrigger) delete lastColorTrigger[key];
  });

  function getDetectedColor(r, g, b, thresh) {
    const max = Math.max(r, g, b);
    if (max < thresh) return null;

    if (r > 1.3 * g && r > 1.3 * b) return { name: 'Red', hex: '#ef4444' };
    if (g > 1.2 * r && g > 1.1 * b) return { name: 'Green', hex: '#22c55e' };
    if (b > 1.2 * r && b > 1.1 * g) return { name: 'Blue', hex: '#3b82f6' };
    if (r > 180 && g > 180 && b < 120) return { name: 'Yellow', hex: '#eab308' };
    if (g > 160 && b > 160 && r < 120) return { name: 'Cyan', hex: '#06b6d4' };

    return null;
  }

  function drawLargeTriggerMarker(x, y, colorHex) {
    const time = performance.now() * 0.005;
    const radius = 24 + Math.sin(time) * 4;

    ctx.save();
    ctx.strokeStyle = colorHex;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, 2 * Math.PI);
    ctx.stroke();

    ctx.fillStyle = colorHex;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, 2 * Math.PI);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - radius - 8, y);
    ctx.lineTo(x + radius + 8, y);
    ctx.moveTo(x, y - radius - 8);
    ctx.lineTo(x, y + radius + 8);
    ctx.stroke();
    ctx.restore();
  }

  function processFrame() {
    if (!isCameraRunning) return;

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    if (canvas.width > 0 && canvas.height > 0) {
      if (!hasHardwareZoom && currentZoom > 1.0) {
        const cropW = canvas.width / currentZoom;
        const cropH = canvas.height / currentZoom;
        const cropX = (canvas.width - cropW) / 2;
        const cropY = (canvas.height - cropH) / 2;
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }

      const lineXPercent = parseFloat(lineXSlider.value) / 100;
      const lineTopPercent = parseFloat(lineTopSlider.value) / 100;
      const lineBottomPercent = parseFloat(lineBottomSlider.value) / 100;

      const targetX = Math.floor(canvas.width * lineXPercent);
      const startY = Math.floor(canvas.height * lineTopPercent);
      const endY = Math.floor(canvas.height * lineBottomPercent);
      const stripHeight = Math.max(1, endY - startY);

      const thresh = parseInt(threshSlider.value, 10);
      const now = performance.now();

      // Sample only between startY and endY
      const stripWidth = 3;
      const startX = Math.max(0, targetX - 1);
      const imgData = ctx.getImageData(startX, startY, stripWidth, stripHeight).data;

      const currentHits = [];

      for (let relY = 0; relY < stripHeight; relY += 4) {
        const absY = startY + relY;
        for (let xOffset = 0; xOffset < stripWidth; xOffset++) {
          const idx = (relY * stripWidth + xOffset) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];

          const color = getDetectedColor(r, g, b, thresh);
          if (color) {
            currentHits.push({ name: color.name, hex: color.hex, x: startX, y: absY });
          }
        }
      }

      currentHits.forEach((hit) => {
        if (!lastColorTrigger[hit.name] || (now - lastColorTrigger[hit.name] > DEBOUNCE_MS)) {
          lastColorTrigger[hit.name] = now;
          recordCrossing(hit.name, now);
        }
        activeTriggers = activeTriggers.filter(t => now - t.time < 1500);
        activeTriggers.push({ x: hit.x, y: hit.y, hex: hit.hex, time: now });
      });

      activeTriggers.forEach((marker) => {
        drawLargeTriggerMarker(marker.x, marker.y, marker.hex);
      });

      // Render Virtual Transit Sightline (Shortened to Top and Bottom Bounds)
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.9)';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(targetX, startY);
      ctx.lineTo(targetX, endY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Top and Bottom Boundary End-Caps
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(targetX - 8, startY - 2, 16, 4);
      ctx.fillRect(targetX - 8, endY - 2, 16, 4);
    }

    requestAnimationFrame(processFrame);
  }

  function recordCrossing(colorName, timestamp) {
    const place = finishCrossings.length + 1;
    let splitText = '--- (Winner)';
    let elapsedText = 'N/A';

    if (raceStartTime !== null) {
      const elapsedMs = timestamp - raceStartTime;
      elapsedText = `${(elapsedMs / 1000).toFixed(2)}s`;
    }

    if (finishCrossings.length > 0) {
      const winnerTimestamp = finishCrossings[0].timestamp;
      const diffSec = ((timestamp - winnerTimestamp) / 1000).toFixed(2);
      splitText = `+${diffSec}s`;
    }

    finishCrossings.push({ place, colorName, timestamp, elapsedText, splitText });

    const row = document.createElement('tr');
    const colorHex = colorName === 'Green' ? '#22c55e' : colorName === 'Red' ? '#ef4444' : colorName === 'Blue' ? '#3b82f6' : '#eab308';
    row.innerHTML = `
      <td>#${place}</td>
      <td><span class="badge" style="background:${colorHex}"></span>${colorName}</td>
      <td><strong>${elapsedText}</strong></td>
      <td>${splitText}</td>
    `;
    resultsBody.appendChild(row);
  }
</script>
</body>
</html>
