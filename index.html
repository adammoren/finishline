<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Finish Line LED Timing</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 60vh;
      background: #000;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #ui {
      padding: 10px 16px;
      height: 40vh;
      box-sizing: border-box;
      overflow-y: auto;
      background: #1e1e1e;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    button {
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #555; }
    .slider-group {
      display: flex;
      flex-direction: column;
      font-size: 12px;
      flex: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-top: 8px;
    }
    th, td {
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    .badge {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="ui">
  <div class="controls">
    <button id="startBtn">Start Camera</button>
    <button id="resetBtn">Reset Results</button>
    <div class="slider-group">
      <label>Finish Line Position: <span id="posVal">50%</span></label>
      <input type="range" id="lineSlider" min="10" max="90" value="50" />
    </div>
  </div>
  <div class="controls">
    <div class="slider-group">
      <label>Min Brightness Threshold: <span id="threshVal">200</span></label>
      <input type="range" id="threshSlider" min="100" max="255" value="200" />
    </div>
  </div>

  <h3>Finish Order & Splits</h3>
  <table>
    <thead>
      <tr>
        <th>Place</th>
        <th>Color</th>
        <th>Timestamp</th>
        <th>Delta (Split)</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const lineSlider = document.getElementById('lineSlider');
  const threshSlider = document.getElementById('threshSlider');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const resultsBody = document.getElementById('resultsBody');

  let isRunning = false;
  let finishCrossings = [];
  const DEBOUNCE_MS = 4000; // Ignore same color hits within 4 seconds
  const lastColorTrigger = {};

  startBtn.addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      video.play();
      startBtn.disabled = true;
      isRunning = true;
      requestAnimationFrame(processFrame);
    } catch (err) {
      alert('Camera access denied or unavailable: ' + err.message);
    }
  });

  lineSlider.addEventListener('input', (e) => {
    document.getElementById('posVal').innerText = `${e.target.value}%`;
  });
  threshSlider.addEventListener('input', (e) => {
    document.getElementById('threshVal').innerText = e.target.value;
  });

  resetBtn.addEventListener('click', () => {
    finishCrossings = [];
    resultsBody.innerHTML = '';
    for (let key in lastColorTrigger) delete lastColorTrigger[key];
  });

  function getDetectedColor(r, g, b, thresh) {
    const max = Math.max(r, g, b);
    if (max < thresh) return null; // Too dim

    // Simple RGB Hue categorization
    if (r > 1.3 * g && r > 1.3 * b) return { name: 'Red', hex: '#ef4444' };
    if (g > 1.2 * r && g > 1.1 * b) return { name: 'Green', hex: '#22c55e' };
    if (b > 1.2 * r && b > 1.1 * g) return { name: 'Blue', hex: '#3b82f6' };
    if (r > 180 && g > 180 && b < 120) return { name: 'Yellow', hex: '#eab308' };
    if (g > 160 && b > 160 && r < 120) return { name: 'Cyan', hex: '#06b6d4' };

    return null;
  }

  function processFrame() {
    if (!isRunning) return;

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    if (canvas.width > 0 && canvas.height > 0) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const linePercent = parseFloat(lineSlider.value) / 100;
      const targetX = Math.floor(canvas.width * linePercent);
      const thresh = parseInt(threshSlider.value, 10);
      const now = performance.now();

      // Sample a 3-pixel-wide vertical strip along the finish line
      const stripWidth = 3;
      const startX = Math.max(0, targetX - 1);
      const imgData = ctx.getImageData(startX, 0, stripWidth, canvas.height).data;

      const detectedInFrame = new Set();

      for (let y = 0; y < canvas.height; y += 4) { // Step 4px for performance
        for (let xOffset = 0; xOffset < stripWidth; xOffset++) {
          const idx = (y * stripWidth + xOffset) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];

          const color = getDetectedColor(r, g, b, thresh);
          if (color) {
            detectedInFrame.add(color.name);

            // Highlight hit on canvas
            ctx.fillStyle = color.hex;
            ctx.fillRect(startX, y, 6, 6);
          }
        }
      }

      // Check crossings with debounce
      detectedInFrame.forEach((colName) => {
        if (!lastColorTrigger[colName] || (now - lastColorTrigger[colName] > DEBOUNCE_MS)) {
          lastColorTrigger[colName] = now;
          recordCrossing(colName, now);
        }
      });

      // Draw Virtual Sighting Line
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(targetX, 0);
      ctx.lineTo(targetX, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    requestAnimationFrame(processFrame);
  }

  function recordCrossing(colorName, timestamp) {
    const place = finishCrossings.length + 1;
    let deltaText = '--- (Winner)';

    if (finishCrossings.length > 0) {
      const firstTime = finishCrossings[0].timestamp;
      const diffSec = ((timestamp - firstTime) / 1000).toFixed(2);
      deltaText = `+${diffSec}s`;
    }

    finishCrossings.push({ place, colorName, timestamp, deltaText });

    const row = document.createElement('tr');
    const colorHex = colorName === 'Green' ? '#22c55e' : colorName === 'Red' ? '#ef4444' : colorName === 'Blue' ? '#3b82f6' : '#eab308';
    row.innerHTML = `
      <td>#${place}</td>
      <td><span class="badge" style="background:${colorHex}"></span>${colorName}</td>
      <td>${(timestamp / 1000).toFixed(2)}s</td>
      <td><strong>${deltaText}</strong></td>
    `;
    resultsBody.appendChild(row);
  }
</script>
</body>
</html>
